name: Build & Release

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: StoneDrop
        path: target/*.jar

    - name: Extract version from pom.xml
      id: version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: temurin
        cache: maven

    - name: Extract current version
      id: version
      run: echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> "$GITHUB_OUTPUT"

    - name: Bump patch version
      id: bump
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        CURRENT="${{ steps.version.outputs.VERSION }}"
        MAJOR=$(echo $CURRENT | cut -d. -f1)
        MINOR=$(echo $CURRENT | cut -d. -f2)
        PATCH=$(echo $CURRENT | cut -d. -f3)
        NEW_PATCH=$((PATCH + 1))
        NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
        echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_OUTPUT"
        sed -i "s|<version>$CURRENT</version>|<version>$NEW_VERSION</version>|" pom.xml

    - name: Build with bumped version
      run: mvn -B package --file pom.xml

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.bump.outputs.NEW_VERSION }}
        name: StoneDrop v${{ steps.bump.outputs.NEW_VERSION }}
        generate_release_notes: true
        files: target/*.jar
        overwrite: true

    - name: Push bump commit via auto-merge PR
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        NEW_VERSION="${{ steps.bump.outputs.NEW_VERSION }}"
        BRANCH="bump-version/v$NEW_VERSION"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -b "$BRANCH"
        git add pom.xml
        git commit -m "Bump version to $NEW_VERSION [skip ci]"
        git push origin "$BRANCH"
        PR_URL=$(gh pr create \
          --base master \
          --head "$BRANCH" \
          --title "Bump version to $NEW_VERSION" \
          --body "Auto-bump after releasing v$NEW_VERSION" \
          --label automated)
        gh pr merge "$PR_URL" --auto --squash
